<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="실태조사">
<link rel="apple-touch-icon" href="icon-192.png">
<title>3종시설물 실태조사 현장 체크리스트</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--sub:#5d6670;--bd:#d5d9df;--pri:#1f5fbf;--priTx:#fff;--ok:#1f8a4c;--warn:#c77700;--bad:#c62828}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#e8ebef;--sub:#9aa4af;--bd:#333b44;--pri:#5b9cf5;--priTx:#08111f;--ok:#4cc27d;--warn:#f0a73a;--bad:#ef6b6b}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding-bottom:110px}
.w{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:8px 0 2px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--sub)}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.b{flex:1 1 0;min-width:48px;padding:10px 4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;text-align:center;cursor:pointer}
.b small{display:block;color:var(--sub);font-size:11px}
.b.on{background:var(--pri);border-color:var(--pri);color:var(--priTx)}.b.on small{color:inherit}
.na{flex:1.4 1 0}
.ph{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.ph div{position:relative;flex:0 0 auto}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);display:block}
.ph button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;padding:0}
.cam{display:inline-block;padding:10px 14px;border-radius:8px;background:var(--pri);color:var(--priTx);cursor:pointer;font-weight:600}
.cam input{display:none}
.it{font-weight:600}.tag{float:right;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--sub)}
#bar{flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center;justify-content:center}
#bar b{font-size:18px}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.sc{font-size:28px;font-weight:700}
.st{display:inline-block;padding:4px 14px;border-radius:14px;font-weight:700;color:#fff}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;font:inherit;font-size:12px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px}.sheet figure label{margin-top:4px}.sheet input:disabled{opacity:.5}
.slot{display:block;cursor:pointer}.slot input{display:none}.thumb{aspect-ratio:4/3;border:2px dashed var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--sub);text-align:center;overflow:hidden;margin:4px 0}.sheet .thumb img{border-radius:0;width:100%;height:100%;aspect-ratio:auto}
.sheet figure{margin:0;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px}
.sheet img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.sheet input{padding:4px 6px;font-size:12px}
#pr{display:none;color:#000;background:#fff;font-size:8.5pt;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:10mm 12mm}
#pr h3{font-size:14pt;margin:0 0 2mm}#pr h4{font-size:11pt;margin:0 0 2mm}
#pr table{width:100%;border-collapse:collapse;table-layout:fixed}
#pr th,#pr td{border:1px solid #000;padding:1mm 1.2mm;text-align:center;vertical-align:middle;font-weight:normal;overflow-wrap:anywhere;word-break:keep-all}
#pr th{background:#e6e6e6;font-weight:bold}
#pr td.l{text-align:left}
#pr .t2{margin-top:-1px}
#pr .pg{box-sizing:border-box;height:276mm;break-after:page;page-break-after:always}#pr .pg:last-child{break-after:auto;page-break-after:auto}#pr .pg+.pg{break-before:page;page-break-before:always}
#pr .pgrid{display:grid;grid-template-columns:1fr 1fr;border:2px solid #000}
#pr .box{min-width:0}
#pr .box:nth-child(odd){border-right:2px solid #000}
#pr .box:nth-child(-n+4){border-bottom:2px solid #000}
#pr .box td{font-size:9pt;height:6.5mm;padding:0 1mm}
#pr .box tr:first-child td{border-top:0}
#pr .box td:first-child{border-left:0}
#pr .box td:last-child{border-right:0}
#pr .box tr:last-child td{border-bottom:0}
#pr .box td.pic{height:63mm;padding:0}
#pr .box img{width:70mm;height:55mm;object-fit:contain;display:block;margin:0 auto}
@media print{.w,#bar{display:none!important}body{background:#fff;color:#000;padding:0;margin:0}#pr{display:block}}
</style>
</head>
<body>
<div id="list" class="w"><h1>3종시설물 실태조사</h1><div class="sub">건물별로 자동 저장됩니다. 건물을 눌러 이어서 수정할 수 있습니다.</div>
<div class="row"><button class="b" id="newb">＋ 새 건물</button><button class="b" id="allb">전체 PDF 만들기</button><button class="b" id="allh">전체 HWPX 만들기</button></div>
<div id="lst"></div>
<div class="c"><h2>저장 공간</h2><div class="sub" id="stg">확인 중…</div><div class="row"><button class="b" id="perb" style="flex:0 0 auto;padding:6px 12px;font-size:13px">자동 삭제 방지 요청</button></div></div>
<div class="c"><h2>백업</h2><div class="sub">폰을 바꾸거나 브라우저 데이터를 지우기 전에 파일로 저장해 두세요.</div>
<div class="row"><button class="b" id="expb">전체 백업 만들기</button><label class="b" style="cursor:pointer">백업 불러오기<input type="file" accept=".json,application/json" id="impf" style="display:none"></label></div><div class="sub" id="bmsg"></div></div>
</div>
<div class="w" id="edit" style="display:none">
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><button class="b" id="back" style="flex:0 0 auto;padding:8px 12px">← 목록</button><div class="it" id="ttl" style="flex:1"></div></div>
<div class="sub">입력 내용과 사진은 이 기기에 자동 저장됩니다.</div>

<div class="c"><h2>시설물 정보</h2><div class="g" id="info"></div></div>

<div class="c"><h2>사진대지</h2><div class="sub" id="sheetinfo"></div><label class="b" style="display:block;margin-top:8px;cursor:pointer">🖼 앨범에서 여러 장 한 번에 넣기<input type="file" accept="image/*" multiple id="albm" style="display:none"></label><div class="sheet" id="sheet" style="margin-top:8px"></div></div>
<div id="items"></div>

<div class="c"><h2>평가결과</h2>
<div class="res">
<span>종합점수</span><span class="sc" id="score">–</span>
<span>안전상태</span><span><span class="st" id="state">–</span></span>
</div>
<div class="sub" id="basis" style="margin-top:6px"></div>
<div id="opts"></div>
<label style="margin-top:8px">종합의견 및 특기사항</label><select id="sumsel"></select><textarea id="sum" style="margin-top:6px"></textarea>
<details class="noprint" style="margin-top:8px"><summary class="sub">안전상태 판정 기준 (변경 가능)</summary>
<div class="g" style="margin-top:6px"><div><label>양호 최소점수</label><input id="t1" type="number" step="0.01"></div><div><label>주의관찰 최소점수</label><input id="t2" type="number" step="0.01"></div></div>
<div class="sub">초기값은 추정치입니다. 지침의 기준값으로 수정해 주세요.</div></details>
</div>



<div class="c noprint"><button class="b" id="reset">이 건물 삭제</button></div>
</div>

<div id="pr"></div>
<div id="bar" style="display:none"><span>종합점수 <b id="s2">–</b></span><button id="pdfb" class="b" style="flex:0 0 auto;padding:10px 14px" onclick="pdfBtn()">PDF 만들기</button><button id="hwb" class="b" style="flex:0 0 auto;padding:10px 14px">HWPX 만들기</button><button id="prb" class="b" style="flex:0 0 auto;padding:10px 14px" onclick="doPrint('all')">인쇄</button></div>

<script>
var ITEMS=["시설물 주변의 지반 침하 또는 이로 인한 건물의 기울음, 균열 상태","구조부재의 균열, 누수 상태","구조부재의 변형(처짐, 기울음, 단면손실 등) 상태","구조부재의 철근 부식, 노출 또는 콘크리트 박리·박락 상태","철골부재의 접합부 상태 (볼트 풀림, 누락, 탈락, 용접불량)","철골부재의 변형(기울음, 좌굴 등) 상태","철골부재의 부식 또는 부재 미시공, 단면손실 상태"];
var GR=[["a",10],["b",8],["c",5],["d",2],["e",0]];
var INFO=[["보고서 장 번호 (예: 5.5)","chap","5.5"],["건물번호","no",""],["시설물명","name",""],["조사일시","date",""],["구분(연면적)","area",""],["구조형식","struct",""],["관리주체","mgr",""],["연락처","tel",""],["주소","addr",""],["책임기술자 성명","en",""],["책임기술자 소속","eo",""],["책임기술자 연락처","et",""]];
var OPTS=[["긴급안전점검","필요","불필요"],["중대결함","있음","없음"],["정밀안전진단","필요","불필요"],["안전조치","필요","불필요"]];
var today=new Date().toISOString().slice(0,10).replace(/-/g,".");
var S=null,db=null,KEY="chk3";
function blank(){var s={info:{},it:ITEMS.map(function(){return{g:null,fix:"X",op:"",ph:[]}}),opt:[1,1,1,1],sum:"",t1:8,t2:5,ph:[null,null,null,null,null,null,null,null,null,null]};INFO.forEach(function(f){s.info[f[1]]=f[1]=="date"?today:(f[1]=="chap"?"5.5":"")});return s}
function $(i){return document.getElementById(i)}
function load(){try{var v=localStorage.getItem(KEY);S=v?JSON.parse(v):blank()}catch(e){S=blank()}if(S.info.chap===undefined)S.info.chap="5.5";if(!S.ph)S.ph=[];while(S.ph.length<10)S.ph.push(null);if(!S.nt)S.nt=[];while(S.nt.length<10)S.nt.push("")}
function calc(){var v=[];S.it.forEach(function(x){if(x.g!==null&&x.g!=="na")v.push(GR[x.g][1])});
 if(!v.length)return null;return v.reduce(function(a,b){return a+b},0)/v.length}
function stateOf(sc){return sc>=S.t1?["양호","var(--ok)"]:sc>=S.t2?["주의관찰","var(--warn)"]:["지정검토","var(--bad)"]}
var SUMS=[
["1. 문제점 없음 · 일부 균열/누수 (보수 바람직)","조사당일 외관상으로 보이는 문제점은 없으나, 건축물 일부 구조체에 균열 및 누수흔적이 조사되었으며 이는 내구성과 미관향상을 위해 보수를 하는 것이 바람직할 것으로 판단된다."],
["2. 문제점 없음 · 전체적으로 양호","조사당일 외관상으로 보이는 문제점은 없으며, 전체적으로 상태가 양호한 것으로 판단된다."],
["3. 균열/누수 + 연결통로 누수 노후화","조사당일, 건축물 일부 구조체에 균열 및 누수흔적, 연결통로부분 누수로 인해 노후화가 조사되었으며 이는 내구성과 미관향상을 위해 보수를 하는 것이 바람직할 것으로 판단된다."],
["4. 균열/누수 + 조경 블록 균열","조사당일, 건축물 일부 구조체에 균열 및 누수흔적이 조사되었으며 또한, 외부 조경부분 블록에 균열이 상당하므로 보수를 하는 것이 바람직할 것으로 판단된다."],
["5. 균열/누수 있으나 대체로 양호 (노후화)","조사당일, 건축물 일부에 균열 및 누수흔적 있으나 대체로 양호하며 건축물 노후화로 인한 원인으로 판단된다."],
["6. 문제점 없음 · 외부 누수/백태, 양호","조사당일 외관상으로 보이는 문제점은 없으나 외부에 일부 누수 및 백태가 조사되었으며 전체적으로 상태가 양호한 것으로 판단된다."],
["7. 균열/누수 + 박리·박락 + 철근노출","조사당일, 건축물 일부 구조체에 균열 및 누수흔적, 콘크리트 박리·박락, 철근노출이 조사되었으며 이는 내구성과 미관향상을 위해 보수를 하는 것이 바람직할 것으로 판단된다."],
["8. 균열/누수 + 박리·박락 + 외부 주의관찰","조사당일, 건축물 일부 구조체에 균열 및 누수흔적, 콘크리트 박리·박락이 조사되었으며 이는 내구성과 미관향상을 위해 보수를 하는 것이 바람직할 것으로 판단된다. 또한, 외부 콘크리트 박리·박락의 경우 콘크리트 일부가 떨어질 수 있으므로 보수 및 주변 주의관찰이 필요할 것으로 판단된다."]];
function fillSum(){var sel=$("sumsel");sel.innerHTML='<option value="">문구 선택 (선택하면 아래에 입력됩니다)</option>'+SUMS.map(function(x,i){return'<option value="'+i+'">'+x[0]+'</option>'}).join("");
 sel.onchange=function(){if(sel.value==="")return;var t=SUMS[+sel.value][1],ta=$("sum");
  if(ta.value.trim()&&ta.value!==t&&!confirm("현재 입력된 내용을 선택한 문구로 바꿀까요?")){sel.value="";return}
  ta.value=t;S.sum=t;save()}}
var MAN=[
["시설물 주변 지반침하 및 이로 인한 활동적인 균열이 없는 상태","건물의 기울음이나 육안으로 관찰되는 지반침하는 없으나 포장면 일부 침하·균열 발생 등 부분적 경미한 침하가 발생된 상태","지반침하로 증축부위, 이음부위에 균열 및 이격, 변형이 발생된 상태","지반침하로 건물의 기울음, 주요 구조부재 균열, 지하층 바닥 균열 및 누수가 발생되어 즉각적인 보강이 필요한 상태","지반 침하로 인한 심각한 균열 등이 발생된 상태|사용금지, 긴급 보강, 철거 등의 조치를 요하는 상태|건물의 안전성이 극히 우려되는 상태 등"],
["균열 또는 누수가 발생하지 않은 상태","미세 균열이 발생한 상태|구조적인 영향이 아닌 대부분의 손상이 콘크리트의 건조수축에 의해 발생된 상태","균열폭 0.3mm 이상 ~ 0.5mm 미만의 균열이 발생한 상태|구조적 영향을 주는 균열로 진전 될 가능성이 있는 상태","균열폭 0.5mm 이상의 균열이 발생된 상태|관통 균열, 누수가 발생된 상태|누수로 인한 광범위한 백태가 발생된 상태|균열 및 누수로 실내마감재의 광범위한 손상이 발생된 상태|구조적 영향을 주는 균열이 발생된 상태(보 중앙부 밑에서 상향으로 발생된 수직균열, 보 단부 경사균열, 기둥에 발생된 다수의 수직균열 또는 경사균열 등)","구조부재의 심각한 균열 및 누수가 발생한 상태 등"],
